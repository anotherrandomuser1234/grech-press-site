# Netlify configuration for the Grech Press storefront.
# Static site, no build step, no dependencies.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/covers/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

# Unknown paths fall back to the storefront 404 page.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
